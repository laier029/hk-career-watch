name: Update jobs and publish

on:
  push:
    branches: [main]
  schedule:
    # Saturday 09:00 Hong Kong = Saturday 01:00 UTC; GitHub may delay runs.
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch employer, Workopia and JobSpy sources before publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: job-data-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Test fixed filters and read-state logic
        run: |
          python -m unittest discover -s . -p 'test_*.py'
          node --test core.test.cjs
      - name: Restore conditional-request cache
        uses: actions/cache@v4
        with:
          path: cache
          key: job-source-cache-${{ github.run_id }}
          restore-keys: job-source-cache-
      - name: Refresh public sources
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python update.py
      - name: Validate public data and build portable site
        run: python build.py
      - name: Save updated data only
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public job snapshot'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
