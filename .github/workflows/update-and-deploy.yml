name: Update jobs and publish

on:
  push:
    branches: [main]
  schedule:
    # 08:15 Hong Kong, Sunday-Friday; Saturday is the full check below.
    - cron: '15 0 * * 0-5'
    # Saturday 09:00 Hong Kong = Saturday 01:00 UTC; GitHub may delay runs.
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      profile:
        description: light = FreeHire + Workopia; full = all sources; publish = deploy only
        type: choice
        options: [light, full, publish]
        default: light

permissions:
  contents: read

concurrency:
  group: job-data-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Test fixed filters and read-state logic
        run: |
          python -m unittest discover -s . -p 'test_*.py'
          node --test core.test.cjs
      - name: Restore conditional-request cache
        uses: actions/cache@v4
        with:
          path: cache
          key: job-source-cache-${{ github.run_id }}
          restore-keys: job-source-cache-
      - name: Refresh public sources
        id: refresh
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile != 'publish')
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$EVENT" = schedule ]; then
            if [ "$SCHEDULE" = '0 1 * * 6' ]; then PROFILE=full; else PROFILE=light; fi
          fi
          python update.py --profile "$PROFILE"
      - name: Retain failure diagnostics
        if: failure() && steps.refresh.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: source-failure-report
          path: output/last-failure.json
      - name: Validate public data and build portable site
        run: python build.py
      - name: Save updated data only
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile != 'publish')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public job snapshot'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
